<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карты лояльности — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #24232d;
    --dark-600: #7c7b81;
    --dark-200: #d3d3d5;
    --dark-100: #eae9ea;
    --white: #ffffff;
    --light-grey: #f2f2f2;
    --btn-black: #222222;
    --green: #31a456;
    --light-green: #e8f9f0;
    --brand-green: #457454;
    --r-s: 8px;
    --r-m: 12px;
    --r-l: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Manrope', -apple-system, sans-serif;
    background: #3d3c44;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 32px 16px;
  }

  /* ---------- demo wrapper ---------- */
  .demo {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .restart {
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,.65);
    background: rgba(255,255,255,.08);
    border: none; border-radius: 100px;
    padding: 8px 18px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .15s, color .15s;
  }
  .restart:hover { background: rgba(255,255,255,.18); color: #fff; }

  /* ---------- animations ---------- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateX(24px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes shimmer {
    from { background-position: 180% 0; }
    to   { background-position: -80% 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .anim-in { animation: fadeUp .45s cubic-bezier(.2,.7,.3,1) both; }
  .screen.visible.slide { animation: screenIn .28s ease both; }
  .skeleton-row {
    height: 52px; border-radius: var(--r-m);
    margin-bottom: 8px;
    background: linear-gradient(100deg, #e9e9eb 36%, #f6f6f7 50%, #e9e9eb 64%);
    background-size: 200% 100%;
    animation: shimmer 1.1s linear infinite;
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    animation: spin .7s linear infinite;
    display: inline-block;
  }

  /* ---------- phone ---------- */
  .phone {
    width: 393px; height: 812px;
    background: var(--light-grey);
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.visible { display: flex; }

  /* status bar */
  .status-bar {
    height: 54px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 0 0;
    position: relative; z-index: 3;
  }
  .status-bar .time {
    width: 138px; text-align: center;
    font-family: -apple-system, 'SF Pro', 'Manrope', sans-serif;
    font-size: 17px; font-weight: 600; color: var(--dark);
    letter-spacing: -.2px;
  }
  .status-bar .levels { display: flex; align-items: center; gap: 7px; }

  /* header */
  .app-header {
    height: 24px; margin: 16px 16px 0;
    display: flex; align-items: center;
    position: relative; flex-shrink: 0;
  }
  .app-header .back {
    width: 24px; height: 24px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0;
  }
  .app-header .title {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px; line-height: 24px; font-weight: 400;
    color: var(--dark); white-space: nowrap;
  }

  .content {
    flex: 1; overflow-y: auto;
    padding: 24px 16px 0;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }

  /* ---------- screen 1: empty state ---------- */
  .empty-illustration {
    width: 206px; height: 116px; margin: 115px auto 0;
    background: #fff; border-radius: 8px; position: relative;
    box-shadow: 0 8px 24px rgba(30,45,92,.08), 0 2px 6px rgba(30,45,92,.05);
  }
  .empty-illustration .chip  { position: absolute; left: 12px; top: 12px; width: 32px; height: 16px; border-radius: 8px; background: #e9e9eb; }
  .empty-illustration .bar-1 { position: absolute; left: 12px; top: 74px; width: 76px; height: 8px; border-radius: 4px; background: #ececee; }
  .empty-illustration .bar-2 { position: absolute; left: 12px; top: 90px; width: 122px; height: 14px; border-radius: 7px; background: #e4e4e7; }
  .empty-text { margin: 56px 6px 0; }
  .empty-text h2 {
    font-size: 20px; line-height: 28px; font-weight: 700; color: var(--dark);
    margin-bottom: 16px;
  }
  .empty-text ol { list-style: none; counter-reset: n; display: flex; flex-direction: column; gap: 10px; }
  .empty-text ol li {
    counter-increment: n;
    display: flex; gap: 8px;
    font-size: 14px; line-height: 1.4; color: var(--dark);
  }
  .empty-text ol li::before { content: counter(n) "."; color: var(--dark); min-width: 14px; }

  /* ---------- banner ---------- */
  .banner {
    background: var(--green); border-radius: var(--r-m);
    padding: 12px; position: relative; margin-bottom: 24px;
  }
  .banner .banner-title {
    font-size: 20px; line-height: 23px; font-weight: 700; color: #fff;
    max-width: 324px; margin-bottom: 36px;
  }
  .banner .banner-btn {
    height: 24px; padding: 0 48px;
    background: var(--btn-black); color: #fff;
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .banner img.coins {
    position: absolute; right: 12px; top: 44px;
    width: 122px; height: 84px; margin: -5px;
    pointer-events: none;
  }

  /* ---------- program panel (created) ---------- */
  .program-panel {
    background: #fff; border-radius: var(--r-m);
    padding: 12px 16px; margin-bottom: 24px;
  }
  .program-panel .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; min-height: 24px;
  }
  .program-panel .panel-head span { font-size: 16px; line-height: 24px; color: var(--dark); }
  .program-panel .panel-body { padding-top: 16px; }
  .level-view + .level-view { border-top: 1px solid var(--dark-100); margin-top: 14px; padding-top: 14px; }
  .level-view .lv-name {
    display: flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700; color: var(--dark);
    margin-bottom: 12px;
  }
  .level-view .lv-cols { display: flex; }
  .level-view .lv-col { flex: 1; }
  .level-view .lv-label { font-size: 14px; line-height: 1.4; color: var(--dark); margin-bottom: 4px; }
  .level-view .lv-value { font-size: 16px; line-height: 1.4; color: var(--dark); }
  .edit-link {
    display: inline-block; margin-top: 16px;
    font-size: 16px; font-weight: 700; color: var(--brand-green);
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
  }

  /* ---------- cards list ---------- */
  .cards-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .cards-head .t { display: flex; gap: 8px; align-items: center; }
  .cards-head .t b { font-size: 20px; line-height: 28px; font-weight: 700; color: var(--dark); }
  .cards-head .t span { font-size: 20px; line-height: 28px; font-weight: 700; color: var(--dark-600); }
  .cards-head .icons { display: flex; gap: 8px; }
  .card-row {
    background: #fff; border-radius: var(--r-m);
    padding: 12px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-row .l { display: flex; gap: 8px; align-items: center; }
  .card-row .ic {
    width: 28px; height: 28px; border-radius: 4px;
    background: var(--dark-200);
    display: flex; align-items: center; justify-content: center;
  }
  .card-row .num { font-size: 16px; line-height: 1.4; color: var(--dark); }
  .card-row .amount { font-size: 14px; line-height: 1.4; color: var(--dark); padding: 4px 0; }

  /* ---------- create screen ---------- */
  .setup-card {
    background: #fff; border-radius: var(--r-m);
    padding: 16px; display: flex; flex-direction: column; gap: 16px;
  }
  .setup-card > h2 { font-size: 20px; line-height: 28px; font-weight: 500; color: var(--dark); }
  .level-edit { display: flex; flex-direction: column; gap: 12px; }
  .level-edit .lv-head { display: flex; align-items: center; justify-content: space-between; }
  .level-edit .lv-head b { font-size: 16px; line-height: 1.4; font-weight: 700; color: var(--dark); }
  .remove-lv {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--dark-100); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .fields { display: flex; gap: 16px; align-items: flex-start; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field label { font-size: 14px; line-height: 1.4; color: var(--dark); }
  .input {
    height: 48px; background: #fff;
    border: 1px solid var(--dark-200); border-radius: 8px;
    padding: 12px 12px 12px 16px;
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; line-height: 1.4; color: var(--dark);
    cursor: pointer; user-select: none;
  }
  .input.placeholder { color: var(--dark-600); }
  .input .unit { color: var(--dark-600); opacity: .8; font-size: 15px; }
  .field.sum .input { width: 157px; }
  .field.pct .input { min-width: 60px; justify-content: flex-start; }
  .example { font-size: 13px; line-height: 1.4; color: var(--dark); margin-top: -4px; }
  .divider { height: 1px; background: var(--dark-100); }
  .add-level {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; padding: 0; cursor: pointer; font-family: inherit;
    font-size: 16px; font-weight: 700; color: var(--brand-green);
  }
  .bottom-btn-wrap { padding: 0 16px; position: absolute; left: 0; right: 0; top: 732px; }
  .primary-btn {
    width: 100%; height: 55px; border: none; border-radius: 8px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    background: var(--btn-black); color: #fff; cursor: pointer;
  }
  .primary-btn:disabled { background: var(--dark-200); color: var(--dark-600); cursor: default; }

  /* ---------- bottom sheet + keypad ---------- */
  .sheet-overlay {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(36,35,45,.35);
    display: none;
  }
  .sheet-overlay.visible { display: block; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 520px;
    background: #eff0f2;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -12px 45px rgba(30,45,92,.12);
  }
  .sheet .handle {
    width: 42px; height: 3px; border-radius: 2px;
    background: var(--dark-200); margin: 11px auto 0;
  }
  .sheet .value-card {
    margin: 16px 20px 0; height: 100px;
    background: #fff; border-radius: var(--r-m);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .sheet .value-card .vc-label { font-size: 14px; line-height: 1.4; color: var(--dark); }
  .sheet .value-card .vc-value {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 30px; line-height: 36px; font-weight: 600; color: var(--dark);
  }
  .sheet .value-card .vc-value.placeholder { color: var(--dark-600); }
  .sheet .value-card .vc-unit { font-size: 16px; font-weight: 400; color: var(--dark-600); }
  .keypad {
    position: absolute; left: 0; right: 0; bottom: 0; height: 291px;
    background: #d1d3d9;
    padding: 6px 6px 4px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .keypad .key {
    background: #fff; border: none; border-radius: 5px; cursor: pointer;
    font-family: -apple-system, 'SF Pro', 'Manrope', sans-serif;
    box-shadow: 0 1px 0 rgba(132,134,140,.6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-top: 2px;
  }
  .keypad .key .d { font-size: 25px; line-height: 1.15; color: #000; font-weight: 400; }
  .keypad .key .a { font-size: 10px; letter-spacing: 2px; color: #000; font-weight: 700; }
  .keypad .key:active { background: #e6e8eb; }
  .keypad .key.ghost { background: transparent; box-shadow: none; }
  .keypad .zero { grid-column: 2; }
  .sheet-done {
    display: block; margin: 16px 20px 0;
    width: calc(100% - 40px); height: 48px;
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700;
    background: var(--btn-black); color: #fff;
    transition: background .15s, color .15s;
  }
  .sheet-done:disabled { background: var(--dark-200); color: var(--dark-600); cursor: default; }

  /* small helpers */
  svg { display: block; }
  /* ?embed=1 — inside the case page: light card ground, soft shadow, no restart (the back arrow resets), as in the Carbanara embed */
  body.embed{background:#EAEAEA;padding:0;min-height:100vh;justify-content:center;gap:0}
  body.embed .restart{display:none}
  body.embed{overflow:hidden}
  /* Figma 89:15778: the screen is drawn at 222.73x482 with a 1px black inside stroke and r23 — at 1x that is 2px (Chrome snaps 1.7 down to 1) and r39 */
  body.embed .phone{box-shadow:none;border:2px solid #000;border-radius:39px}
</style>
</head>
<body>

<div class="demo">
<div class="phone">

  <!-- ================= LP screen (empty / list / created) ================= -->
  <div class="screen" id="screen-lp">
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="levels" data-statusicons></div>
    </div>
    <div class="app-header">
      <button class="back" aria-label="Назад" onclick="goBack()" data-caret></button>
      <div class="title">Карты лояльности</div>
    </div>
    <div class="content" id="lp-content"></div>
    <div class="bottom-btn-wrap" id="lpBtnWrap" hidden>
      <button class="primary-btn" id="refreshBtn" onclick="refreshCards()">Обновить</button>
    </div>
  </div>

  <!-- ================= Create BP screen ================= -->
  <div class="screen" id="screen-create">
    <div class="status-bar">
      <div class="time">9:41</div>
      <div class="levels" data-statusicons></div>
    </div>
    <div class="app-header">
      <button class="back" aria-label="Назад" onclick="showLp()" data-caret></button>
      <div class="title">Бонусная программа</div>
    </div>
    <div class="content" id="create-content" style="overflow: visible;"></div>
    <div class="bottom-btn-wrap">
      <button class="primary-btn" id="createBtn" onclick="createProgram()">Создать</button>
    </div>

    <!-- bottom sheet -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="handle" onclick="closeSheet()"></div>
        <div class="value-card">
          <div class="vc-label" id="sheetLabel">Процент бонусов</div>
          <div class="vc-value" id="sheetValue"></div>
        </div>
        <button class="sheet-done" id="sheetDone" onclick="closeSheet()">Готово</button>
        <div class="keypad" id="keypad"></div>
      </div>
    </div>
  </div>

</div>

<button class="restart" onclick="restartDemo()">↺&nbsp; Начать сначала</button>
</div>

<script>
/* ============================== icons ============================== */
const I = {
  caret: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 4.5L7.5 12L15 19.5" stroke="#24232d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  plusWhiteSmall: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 4V12M4 8H12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`,

  search: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="10.9" cy="10.9" r="7" stroke="#24232d" stroke-width="1.6"/><path d="M16.4 16.4L21 21" stroke="#24232d" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  swap: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M8.5 5.8V18M8.5 18L5 14.4M8.5 18L12 14.4" stroke="#24232d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.8 18.2V6M15.8 6L12.3 9.6M15.8 6L19.3 9.6" stroke="#24232d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  creditCard: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="1.8" y="4" width="16.4" height="12" rx="2" stroke="#fff" stroke-width="1.5"/><path d="M1.8 8H18.2" stroke="#fff" stroke-width="1.5"/><path d="M5 12.6H9" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>`,

  laurel: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.2L9.3 4.1L11.5 3.6L11.6 5.9L13.7 6.8L12.5 8.7L13.7 10.6L11.6 11.5L11.5 13.8L9.3 13.3L8 15.2L6.7 13.3L4.5 13.8L4.4 11.5L2.3 10.6L3.5 8.7L2.3 6.8L4.4 5.9L4.5 3.6L6.7 4.1L8 2.2Z" stroke="#457454" stroke-width="1.2" stroke-linejoin="round" transform="translate(0,-0.7)"/></svg>`,

  cellular: `<svg width="19" height="12" viewBox="0 0 19 12" fill="#24232d"><rect x="0" y="7.5" width="3" height="4.2" rx="1"/><rect x="5.1" y="5" width="3" height="6.7" rx="1"/><rect x="10.2" y="2.5" width="3" height="9.2" rx="1"/><rect x="15.3" y="0" width="3" height="11.7" rx="1"/></svg>`,
  wifi: `<svg width="17" height="12" viewBox="0 0 17 12" fill="#24232d"><path d="M8.5 11.6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8.5 5.9c1.5 0 2.87.55 3.92 1.47a.55.55 0 0 0 .76-.03l.72-.74a.53.53 0 0 0-.03-.78A7.5 7.5 0 0 0 8.5 3.9a7.5 7.5 0 0 0-5.37 1.92.53.53 0 0 0-.03.78l.72.74c.2.21.54.22.76.03A5.94 5.94 0 0 1 8.5 5.9Z"/><path d="M8.5 1.55A10.6 10.6 0 0 1 15.7 4.4a.55.55 0 0 0 .77-.02l.73-.74a.53.53 0 0 0-.02-.77A12.2 12.2 0 0 0 8.5 0C5.3 0 2.38 1.1.82 2.87a.53.53 0 0 0-.02.77l.73.74c.2.21.55.22.77.02A10.6 10.6 0 0 1 8.5 1.55Z"/></svg>`,
  battery: `<svg width="28" height="13" viewBox="0 0 28 13" fill="none"><rect x="0.5" y="0.5" width="24" height="12" rx="4" stroke="#24232d" stroke-opacity=".35"/><rect x="2" y="2" width="21" height="9" rx="2.5" fill="#24232d"/><path d="M26.3 4.3v4.4c1-.36 1.7-1.2 1.7-2.2s-.7-1.84-1.7-2.2Z" fill="#24232d" fill-opacity=".4"/></svg>`,
  tenge: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.2 2.4H11.8M2.2 5.4H11.8M7 5.4V12.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`
};

const CARD_NUMBERS = [
  '5678 9012 3456','6789 0123 4567','7890 1234 5678','4567 8901 2345','2345 6789 0123',
  '8901 2345 6789','4567 8901 2345','3456 7890 1234','2345 6789 0123','1234 5678 9012'
];

/* ============================== state ============================== */
const state = {
  view: 'lp',               // 'lp' | 'create'
  cardsAdded: false,
  refreshing: false,
  listPhase: null,          // null | 'skeleton' | 'appear'
  created: false,
  collapsed: false,
  levels: [{ sum: null, pct: null }],
  sheet: null                // { levelIndex, field: 'sum' | 'pct' }
};

/* ============================== utils ============================== */
const fmt = n => n == null ? '' : n.toLocaleString('ru-RU').replace(/,/g, ' ');
const esc = s => s.replace(/</g, '&lt;');

function levelsComplete() {
  return state.levels.every(l => l.sum > 0 && l.pct > 0);
}

/* ============================== render: LP ============================== */
function renderLp() {
  const c = document.getElementById('lp-content');
  const btnWrap = document.getElementById('lpBtnWrap');
  btnWrap.hidden = state.cardsAdded;

  if (!state.cardsAdded) {
    document.getElementById('refreshBtn').innerHTML =
      state.refreshing ? '<span class="spinner"></span>' : 'Обновить';
    c.innerHTML = `
      <div class="empty-illustration"><div class="chip"></div><div class="bar-1"></div><div class="bar-2"></div></div>
      <div class="empty-text">
        <h2>Нет добавленных карт лояльности</h2>
        <ol>
          <li>Перейдите в настройки терминала.</li>
          <li>Запустите режим добавления карт.</li>
          <li>Прикладывайте карты к терминалу по&nbsp;очереди.</li>
          <li>Добавленные карты автоматически отобразятся в этом разделе.</li>
        </ol>
      </div>`;
    return;
  }

  /* появление карт: шиммер-скелетоны, затем каскад карточек */
  if (state.listPhase === 'skeleton') {
    c.innerHTML = `
      <div class="anim-in">
      <div class="banner">
        <div class="banner-title">Создайте бонусную программу для&nbsp;ваших клиентов</div>
        <button class="banner-btn">Создать ${I.plusWhiteSmall}</button>
        <img class="coins" src="assets/banner.png" alt="">
      </div>
      </div>
      <div class="cards-head anim-in" style="animation-delay:.08s">
        <div class="t"><b>Карты</b><span></span></div>
        <div class="icons">${I.search}${I.swap}</div>
      </div>
      ${Array.from({length: 9}, (_, i) =>
        `<div class="skeleton-row anim-in" style="animation-delay:${.1 + i * .04}s"></div>`).join('')}`;
    return;
  }

  let top;
  if (!state.created) {
    top = `
      <div class="banner">
        <div class="banner-title">Создайте бонусную программу для&nbsp;ваших клиентов</div>
        <button class="banner-btn" onclick="showCreate()">Создать ${I.plusWhiteSmall}</button>
        <img class="coins" src="assets/banner.png" alt="">
      </div>`;
  } else if (state.collapsed) {
    top = `
      <div class="program-panel">
        <div class="panel-head" onclick="toggleCollapse()">
          <span>Бонусная программа</span>${I.chevronDown}
        </div>
      </div>`;
  } else {
    const lvls = state.levels.map((l, i) => `
      <div class="level-view">
        <div class="lv-name">${I.laurel} Уровень ${i + 1}</div>
        <div class="lv-cols">
          <div class="lv-col">
            <div class="lv-label">При пополнении от</div>
            <div class="lv-value">${fmt(l.sum)} ₸</div>
          </div>
          <div class="lv-col">
            <div class="lv-label">Процент бонусов</div>
            <div class="lv-value">${l.pct} %</div>
          </div>
        </div>
      </div>`).join('');
    top = `
      <div class="program-panel">
        <div class="panel-head" onclick="toggleCollapse()">
          <span>Бонусная программа</span>${I.chevronUp}
        </div>
        <div class="panel-body">
          ${lvls}
          <button class="edit-link" onclick="showCreate()">Изменить программу</button>
        </div>
      </div>`;
  }

  const appear = state.listPhase === 'appear';
  const rows = CARD_NUMBERS.map((n, i) => `
    <div class="card-row ${appear ? 'anim-in' : ''}" ${appear ? `style="animation-delay:${i * .06}s"` : ''}>
      <div class="l"><div class="ic">${I.creditCard}</div><div class="num">${n}</div></div>
      <div class="amount">0 ₸</div>
    </div>`).join('');

  c.innerHTML = `
    ${top}
    <div class="cards-head">
      <div class="t"><b>Карты</b><span id="cardCount">${appear ? '' : '23'}</span></div>
      <div class="icons">${I.search}${I.swap}</div>
    </div>
    ${rows}
    <div style="height:16px"></div>`;

  if (appear) animateCount(23, 700);
}

/* счётчик карт «тикает» вверх при появлении */
function animateCount(target, ms) {
  const el = document.getElementById('cardCount');
  const t0 = performance.now();
  (function tick(t) {
    const p = Math.min(1, (t - t0) / ms);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1 && el.isConnected) requestAnimationFrame(tick);
  })(t0);
}

/* ============================== render: create ============================== */
function renderCreate() {
  const c = document.getElementById('create-content');
  const blocks = state.levels.map((l, i) => {
    const sumFilled = l.sum > 0, pctFilled = l.pct > 0;
    const example = (sumFilled && pctFilled)
      ? `<div class="example">Пример:&nbsp; ${fmt(l.sum)} ₸ = ${fmt(Math.round(l.sum * l.pct / 100))} б.</div>` : '';
    const removeBtn = i > 0
      ? `<button class="remove-lv" onclick="removeLevel(${i})" aria-label="Удалить уровень">${I.close}</button>` : '';
    return `
      <div class="level-edit">
        <div class="lv-head"><b>Уровень ${i + 1}</b>${removeBtn}</div>
        <div class="fields">
          <div class="field sum">
            <label>От суммы пополнения</label>
            <div class="input ${sumFilled ? '' : 'placeholder'}" onclick="openSheet(${i}, 'sum')">
              ${sumFilled ? fmt(l.sum) : '0'} <span class="unit">${I.tenge}</span>
            </div>
          </div>
          <div class="field pct">
            <label>Процент бонусов</label>
            <div class="input ${pctFilled ? '' : 'placeholder'}" onclick="openSheet(${i}, 'pct')">
              ${pctFilled ? l.pct : '0'}&nbsp;%
            </div>
          </div>
        </div>
        ${example}
      </div>
      <div class="divider"></div>`;
  }).join('');

  c.innerHTML = `
    <div class="setup-card">
      <h2>Настройка бонусов</h2>
      ${blocks}
      <button class="add-level" onclick="addLevel()">${I.plusGreen} Добавить уровень бонусов</button>
    </div>`;

  document.getElementById('createBtn').disabled = !levelsComplete();
}

/* ============================== render: sheet ============================== */
function renderSheet() {
  const overlay = document.getElementById('sheetOverlay');
  if (!state.sheet) { overlay.classList.remove('visible'); return; }
  overlay.classList.add('visible');

  const { levelIndex, field } = state.sheet;
  const val = state.levels[levelIndex][field];
  document.getElementById('sheetLabel').textContent =
    field === 'sum' ? 'Сумма пополнения' : 'Процент бонусов';

  const vEl = document.getElementById('sheetValue');
  const shown = val == null ? '0' : (field === 'sum' ? fmt(val) : String(val));
  const unit = field === 'sum'
    ? `<span class="vc-unit">${I.tenge}</span>`
    : `<span class="vc-unit">%</span>`;
  vEl.className = 'vc-value' + (val == null ? ' placeholder' : '');
  vEl.innerHTML = `${shown} ${unit}`;
  document.getElementById('sheetDone').disabled = val == null;
}

function buildKeypad() {
  const letters = { 2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ' };
  let html = '';
  for (let d = 1; d <= 9; d++) {
    html += `<button class="key" onclick="pressKey(${d})">
      <span class="d">${d}</span><span class="a">${letters[d] || '&nbsp;'}</span></button>`;
  }
  html += `<button class="key zero" onclick="pressKey(0)"><span class="d">0</span></button>`;
  html += `<button class="key ghost" onclick="pressBackspace()">${I.backspace}</button>`;
  document.getElementById('keypad').innerHTML = html;
}

/* ============================== actions ============================== */
function pressKey(d) {
  const { levelIndex, field } = state.sheet;
  const cur = state.levels[levelIndex][field];
  const max = field === 'pct' ? 100 : 10000000;
  let next = (cur == null ? 0 : cur) * 10 + d;
  if (next > max) next = cur == null ? d : cur;
  state.levels[levelIndex][field] = next === 0 ? null : next;
  renderSheet(); renderCreate();
}
function pressBackspace() {
  const { levelIndex, field } = state.sheet;
  const cur = state.levels[levelIndex][field];
  if (cur == null) return;
  const next = Math.floor(cur / 10);
  state.levels[levelIndex][field] = next === 0 ? null : next;
  renderSheet(); renderCreate();
}
function openSheet(levelIndex, field) { state.sheet = { levelIndex, field }; renderSheet(); }
function closeSheet(e) { state.sheet = null; renderSheet(); }

function addLevel() { state.levels.push({ sum: null, pct: null }); renderCreate(); }
function removeLevel(i) { state.levels.splice(i, 1); renderCreate(); }

function showLp() { state.view = 'lp'; state.sheet = null; sync(); }
function showCreate() {
  state.view = 'create';
  if (!state.created && state.levels.length === 0) state.levels = [{ sum: null, pct: null }];
  sync();
}
function createProgram() {
  if (!levelsComplete()) return;
  state.created = true; state.collapsed = false;
  showLp();
}
function toggleCollapse() { state.collapsed = !state.collapsed; renderLp(); }
function goBack() { /* верх иерархии — в прототипе никуда не ведёт */ }

/* ============================== refresh: появление карт ============================== */
let refreshTimers = [];
function refreshCards() {
  if (state.refreshing) return;
  state.refreshing = true;
  renderLp();
  refreshTimers.push(setTimeout(() => {
    state.refreshing = false;
    state.cardsAdded = true;
    state.listPhase = 'skeleton';
    renderLp();
    refreshTimers.push(setTimeout(() => {
      state.listPhase = 'appear';
      renderLp();
      refreshTimers.push(setTimeout(() => { state.listPhase = null; }, 1300));
    }, 950));
  }, 850));
}

function restartDemo() {
  refreshTimers.forEach(clearTimeout); refreshTimers = [];
  Object.assign(state, {
    view: 'lp', cardsAdded: false, refreshing: false, listPhase: null,
    created: false, collapsed: false, sheet: null,
    levels: [{ sum: null, pct: null }]
  });
  sync();
}

/* ============================== sync ============================== */
let lastView = null;
function sync() {
  const lp = document.getElementById('screen-lp');
  const cr = document.getElementById('screen-create');
  lp.classList.toggle('visible', state.view === 'lp');
  cr.classList.toggle('visible', state.view === 'create');
  const active = state.view === 'lp' ? lp : cr;
  if (lastView !== null && lastView !== state.view) {
    active.classList.remove('slide');
    void active.offsetWidth;           /* перезапуск CSS-анимации */
    active.classList.add('slide');
  }
  lastView = state.view;
  renderLp(); renderCreate(); renderSheet();
}

/* ============================== init ============================== */
document.querySelectorAll('[data-caret]').forEach(el => el.innerHTML = I.caret);
document.querySelectorAll('[data-statusicons]').forEach(el =>
  el.innerHTML = I.cellular + I.wifi + I.battery);
buildKeypad();
sync();
</script>
<script>if(location.search.includes("embed=1"))document.body.classList.add("embed");</script>
</body>
</html>
